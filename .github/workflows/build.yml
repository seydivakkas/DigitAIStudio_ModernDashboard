name: Build (.NET 8 / Windows)

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore "DigitAIStudio.sln"
      - name: Build (Release)
        run: dotnet build "DigitAIStudio.sln" --configuration Release --no-restore
